<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nela Team</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ece6ff;--bg2:#e7f1fd;--bg3:#f4effd;
  --card:rgba(255,255,255,.9);--border:rgba(255,255,255,.95);
  --text:#1f1537;--muted:#6f6190;--sub:rgba(0,0,0,.52);--line:rgba(0,0,0,.13);
  --accent:#8E4CEE;--accent2:#b58af7;--shadow:rgba(90,60,160,.12);--ring:#fff;--ltfilter:none;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#1d1238;--bg2:#12203a;--bg3:#190f30;
    --card:rgba(255,255,255,.07);--border:rgba(255,255,255,.12);
    --text:#f3ecff;--muted:#cbbde8;--sub:rgba(255,255,255,.55);--line:rgba(255,255,255,.2);
    --accent:#a272f5;--accent2:#7c4fd6;--shadow:rgba(0,0,0,.35);--ring:#3a2a63;--ltfilter:invert(1) hue-rotate(180deg);
  }
}
:root[data-theme="dark"]{
  --bg1:#1d1238;--bg2:#12203a;--bg3:#190f30;
  --card:rgba(255,255,255,.07);--border:rgba(255,255,255,.12);
  --text:#f3ecff;--muted:#cbbde8;--sub:rgba(255,255,255,.55);--line:rgba(255,255,255,.2);
  --accent:#a272f5;--accent2:#7c4fd6;--shadow:rgba(0,0,0,.35);--ring:#3a2a63;--ltfilter:invert(1) hue-rotate(180deg);
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:"Vazirmatn",Tahoma,sans-serif;color:var(--text);min-height:100vh;
  background:var(--bg3);
  background-image:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
  background-attachment:fixed;display:flex;justify-content:center;padding:30px 18px 26px;
}
.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;min-height:calc(100vh - 56px)}
header{text-align:center;margin-bottom:24px}
.logo{
  width:98px;height:98px;border-radius:50%;margin:0 auto 8px;overflow:hidden;background:#fff;
  border:4px solid var(--ring);box-shadow:0 0 0 3px var(--accent2),0 12px 30px rgba(142,76,238,.28);
}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.lt{display:block;width:150px;height:auto;margin:6px auto 0;filter:var(--ltfilter)}
.tag{
  margin-top:10px;font-family:"Vazirmatn",Arial,sans-serif;direction:ltr;
  font-size:10.5px;font-weight:600;letter-spacing:1.9px;text-transform:uppercase;color:var(--sub);
}
.card{
  display:flex;align-items:center;gap:12px;height:80px;padding:0 10px 0 14px;margin-bottom:12px;
  background:var(--card);border:1px solid var(--border);border-radius:24px;
  box-shadow:0 10px 28px var(--shadow);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.ico{width:60px;height:60px;flex:none;border-radius:17px;overflow:hidden;background:#eee;box-shadow:0 4px 12px var(--shadow)}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
.ttl{flex:1;font-size:15px;font-weight:800;line-height:1.7}
.btn{
  display:block;flex:none;width:118px;text-align:center;white-space:nowrap;text-decoration:none;color:#fff;
  font-weight:700;font-size:12.5px;line-height:1;padding:11px 0;border-radius:13px;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  box-shadow:0 6px 16px rgba(142,76,238,.3);transition:transform .15s;
}
.btn:active{transform:scale(.96)}
footer{margin-top:auto;padding-top:28px;text-align:center}
.sup{font-size:14px;font-weight:800;color:var(--muted);margin-bottom:12px}
.ids{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.id{
  display:block;text-decoration:none;color:var(--text);direction:ltr;
  font-family:Arial,sans-serif;font-size:13.5px;font-weight:700;letter-spacing:.3px;
  padding:12px 0;border-radius:16px;background:#fff;border:1px solid var(--line);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .id{background:rgba(255,255,255,.08)}}
:root[data-theme="dark"] .id{background:rgba(255,255,255,.08)}
</style>
